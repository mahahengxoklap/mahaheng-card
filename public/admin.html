<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - ລະບົບຄິວເຕີມເງິນ Manual</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; text-align: center; margin: 0; padding: 20px; }
        .admin-container { background: #1e293b; border: 2px solid #334155; border-radius: 12px; max-width: 600px; margin: 20px auto; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: left; }
        input { padding: 10px; font-size: 15px; border-radius: 6px; border: 1px solid #475569; text-align: center; width: 100%; margin-bottom: 10px; background: #0f172a; color: white; box-sizing: border-box; }
        button { background: #22c55e; color: white; border: none; padding: 10px 18px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.2s; }
        button:hover { background: #16a34a; }
        .error { color: #ef4444; font-weight: bold; margin-top: 8px; text-align: center; }
        .success { color: #22c55e; font-weight: bold; margin-top: 8px; text-align: center; }
        .slip-preview { width: 100%; max-height: 280px; object-fit: contain; border: 2px dashed #475569; border-radius: 6px; margin-bottom: 10px; background: #000; }
        
        .queue-badge { background: #ef4444; color: white; padding: 2px 8px; border-radius: 10px; font-size: 14px; }
        .queue-list { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; }
        .queue-item { background: #334155; padding: 8px 12px; border-radius: 6px; cursor: pointer; white-space: nowrap; border: 2px solid transparent; font-size: 14px; }
        .queue-item.active { border-color: #38bdf8; background: #1e3a8a; }
    </style>
</head>
<body>
    <h1>🛡️ Admin Panel - ຄິວລໍຖ້າກວດສອບສະລິບ</h1>
    
    <div class="admin-container">
        <h3>📋 รายການຄິວລໍຖ້າຢືນຍັນ <span id="queueCount" class="queue-badge">0</span></h3>
        <div id="queueListContainer" class="queue-list">
            <span style="color: #94a3b8; font-size: 13px;">ຍັງບໍ່ມີຄິວລໍຖ້າໃນລະບົບ...</span>
        </div>

        <div id="activeQueueSection" style="display:none;">
            <hr style="border-color: #334155; margin: 15px 0;">
            <h3 style="text-align: center; margin-bottom: 10px;">📷 ຮູບສະລິບຂອງລູກຄ້າທີ່ເລືອກ</h3>
            <img id="adminSlipImg" class="slip-preview" src="" alt="ຮູບສະລິບ">

            <label style="font-size: 13px; color: #94a3b8;">ຊື່ User ຂອງລູກຄ້າ:</label>
            <input type="text" id="adminUser" placeholder="ຊື່ User">

            <label style="font-size: 13px; color: #94a3b8;">ຈຳນວນເງິນ:</label>
            <input type="text" id="adminAmount" placeholder="ຈຳນວນເງິນ" oninput="formatNumberInput(this)">

            <label style="font-size: 13px; color: #94a3b8;">ເລກອ້າງອີງ (Ref No. 13 ຫຼັກ):</label>
            <input type="text" id="adminRef" placeholder="ປ້ອນເລກອ້າງອີງຈາກສະລິບ">
            
            <button onclick="submitAdminDeposit()">✅ ຢືນຍັນເຕີມເງິນໃຫ້ User ນີ້</button>
            <p id="adminStatus"></p>
        </div>

        <div id="noActiveSection" style="text-align: center; padding: 30px; color: #94a3b8;">
            <p>📭 ບໍ່ມີรายการສະລິບທີ່ຕ້ອງກວດສອບໃນຂະນະນີ້</p>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let pendingQueue = []; // ເກັບລາຍການຄິວທັງໝົດ
        let currentIndex = -1; // Index ຂອງຄິວທີ່ກຳລັງເບິ່ງຢູ່

        // 🔄 ໂຫຼດຄິວເກົ່າຈາກ localStorage ຕອນເປີດໜ້າ Admin
        window.onload = function() {
            let savedQueue = localStorage.getItem('admin_pending_queue');
            if (savedQueue) {
                try {
                    pendingQueue = JSON.parse(savedQueue);
                } catch(e) {
                    pendingQueue = [];
                }
            }
            renderQueueUI();
        };

        // 🟢 ຮັບข้อมูลຮູບສະລິບທີ່ AI ອ່ານບໍ່ຜ່ານແບບ Real-time ເຂົ້າມາເພີ່ມໃນຄິວ
        socket.on('admin_show_failed_slip', (data) => {
            if (data && data.slip) {
                // ປ້ອງກັນການສົ່ງ Ref/Slip ຊ້ຳກັນ
                let exists = pendingQueue.some(item => item.slip === data.slip || (item.username === data.username && item.amount === data.amount));
                if (!exists) {
                    pendingQueue.push({
                        id: Date.now(),
                        username: data.username || '',
                        amount: data.amount || 0,
                        slip: data.slip
                    });
                    saveAndRenderQueue();
                }
            }
        });

        function saveAndRenderQueue() {
            localStorage.setItem('admin_pending_queue', JSON.stringify(pendingQueue));
            renderQueueUI();
        }

        function renderQueueUI() {
            let countBadge = document.getElementById('queueCount');
            let listContainer = document.getElementById('queueListContainer');
            let activeSection = document.getElementById('activeQueueSection');
            let noActiveSection = document.getElementById('noActiveSection');

            countBadge.innerText = pendingQueue.length;

            if (pendingQueue.length === 0) {
                listContainer.innerHTML = '<span style="color: #94a3b8; font-size: 13px;">ຍັງບໍ່ມີຄິວລໍຖ້າໃນລະບົບ...</span>';
                activeSection.style.display = 'none';
                noActiveSection.style.display = 'block';
                currentIndex = -1;
                return;
            }

            noActiveSection.style.display = 'none';
            activeSection.style.display = 'block';

            // ສ້າງປຸ່ມລາຍຊື່ຄິວ
            listContainer.innerHTML = '';
            pendingQueue.forEach((item, index) => {
                let btn = document.createElement('div');
                btn.className = 'queue-item' + (index === currentIndex ? ' active' : '');
                btn.innerText = `👤 ${item.username} (${item.amount.toLocaleString()} ₭)`;
                btn.onclick = () => selectQueueItem(index);
                listContainer.appendChild(btn);
            });

            // ຖ້າຫາກຍັງບໍ່ໄດ້ເລືອກຄິວໃດ ຫຼື Index ຫຼຸດອອກໄປ ໃຫ້ເລືອກຄິວแรกອັດຕະໂນມັດ
            if (currentIndex === -1 || currentIndex >= pendingQueue.length) {
                selectQueueItem(0);
            } else {
                selectQueueItem(currentIndex);
            }
        }

        function selectQueueItem(index) {
            if (pendingQueue.length === 0) return;
            currentIndex = index;
            let currentItem = pendingQueue[currentIndex];

            // ighlight ປຸ່ມໃນ List
            let items = document.querySelectorAll('.queue-item');
            items.forEach((el, idx) => {
                if (idx === currentIndex) el.classList.add('active');
                else el.classList.remove('active');
            });

            // ສະແດງຂໍ້ມູນລົງ Form
            document.getElementById('adminSlipImg').src = currentItem.slip;
            document.getElementById('adminUser').value = currentItem.username;
            document.getElementById('adminAmount').value = Number(currentItem.amount).toLocaleString();
            document.getElementById('adminRef').value = '';
            document.getElementById('adminStatus').innerText = '';
        }

        function formatNumberInput(input) {
            let value = input.value.replace(/,/g, '').replace(/\D/g, '');
            if (value !== '') {
                input.value = Number(value).toLocaleString();
            } else {
                input.value = '';
            }
        }

        function submitAdminDeposit() {
            if (currentIndex === -1 || pendingQueue.length === 0) return;

            let currentItem = pendingQueue[currentIndex];
            let username = document.getElementById('adminUser').value.trim();
            let amountStr = document.getElementById('adminAmount').value.replace(/,/g, '');
            let amount = parseInt(amountStr);
            let refNo = document.getElementById('adminRef').value.trim();
            let statusElem = document.getElementById('adminStatus');

            if (!username || isNaN(amount) || amount <= 0 || !refNo) {
                statusElem.className = "error";
                statusElem.innerText = "❌ ກະລຸນາປ້ອນຂໍ້ມູນໃຫ້ຄົບຖ້ວນ (ລວມທັງເລກ Ref 13 ຫຼັກ)!";
                return;
            }

            statusElem.className = "";
            statusElem.style.color = "#38bdf8";
            statusElem.innerText = "⏳ ກຳລັງບັນທຶກ ແລະ ກວດສອບເລກ Ref...";

            socket.emit('admin_deposit_request', { username, amount, refNo });
        }

        socket.on('admin_deposit_result', (data) => {
            let statusElem = document.getElementById('adminStatus');
            if (data.status === 'success') {
                statusElem.className = "success";
                statusElem.innerText = data.msg;
                
                // ລຶບຄິວທີ່ສຳເລັດແລ້ວອອກຈາກ Array 
                if (currentIndex !== -1 && pendingQueue.length > 0) {
                    pendingQueue.splice(currentIndex, 1);
                    currentIndex = -1;
                    saveAndRenderQueue();
                }
            } else {
                statusElem.className = "error";
                statusElem.innerText = data.msg; 
            }
        });
    </script>
</body>
</html>
