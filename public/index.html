<script src="/socket.io/socket.io.js"></script>
    <script>
        // 🛠️ ປັບປຸງການເຊື່ອມຕໍ່ Socket.io ໃຫ້ຮອງຮັບ Render Cloud ຢ່າງສະຖຽນ
        const socket = io(window.location.origin, {
            transports: ['websocket', 'polling']
        });

        let myUsername = '';
        let currentRoomId = '';

        // 🔍 ตรวจสอบ Room ID จาก URL ลิงก์ที่เพื่อนส่งมา
        const urlParams = new URLSearchParams(window.location.search);
        const autoRoomId = urlParams.get('room');

        // 💾 ถ้ามี room ในลิงก์ ให้เก็บบันทึกไว้ใน sessionStorage ทันที
        if (autoRoomId) {
            sessionStorage.setItem('mahaheng_pending_room', autoRoomId);
        }

        window.onload = function() {
            let savedUser = sessionStorage.getItem('mahaheng_current_user');
            if (savedUser) {
                myUsername = savedUser;
                let inputElem = document.getElementById('usernameInput');
                if (inputElem) {
                    inputElem.value = myUsername;
                }
                loginUser(true);
            }
        };

        function formatNumberInput(input) {
            let value = input.value.replace(/,/g, '').replace(/\D/g, '');
            if (value !== '') {
                input.value = Number(value).toLocaleString();
            } else {
                input.value = '';
            }
        }

        function setBet(amount) {
            document.getElementById('betInput').value = amount.toLocaleString();
        }

        function loginUser(isAuto = false) {
            let u = isAuto ? myUsername : document.getElementById('usernameInput').value.trim();
            if (!u) {
                alert("ກະລຸນາປ້ອນຊື່ User ກ່ອນ!");
                return;
            }
            myUsername = u;
            sessionStorage.setItem('mahaheng_current_user', myUsername);
            
            socket.emit('login_user', { username: myUsername });
            document.getElementById('displayName').innerText = myUsername;
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('gameBox').style.display = 'block';
            document.getElementById('chatBoxContainer').style.display = 'block';

            // 🚀 ตรวจสอบว่ามีห้องที่ค้างอยู่จากลิงก์หรือไม่ (ทั้งจาก autoRoomId หรือ sessionStorage)
            let targetRoom = autoRoomId || sessionStorage.getItem('mahaheng_pending_room');
            if (targetRoom) {
                document.getElementById('joinRoomInput').value = targetRoom;
                // หน่วงเวลาเล็กน้อยเพื่อให้ Socket เชื่อมต่อเสร็จสมบูรณ์ก่อนเข้าห้อง
                setTimeout(() => {
                    socket.emit('join_custom_room', { roomId: targetRoom });
                    sessionStorage.removeItem('mahaheng_pending_room'); // ล้างค่าทิ้งหลังเข้าห้องแล้ว
                }, 500);
            }
        }

        function logoutUser() {
            sessionStorage.removeItem('mahaheng_current_user');
            sessionStorage.removeItem('mahaheng_pending_room');
            window.location.href = window.location.pathname;
        }

        socket.on('update_balance', (data) => {
            document.getElementById('userCredit').innerText = data.balance.toLocaleString() + ' ກີບ';
        });

        function openDepositModal() { 
            document.getElementById('statusMsg').innerText = '';
            document.getElementById('whatsappDepositBtn').style.display = 'none';
            document.getElementById('depositModal').style.display = 'flex'; 
        }
        function closeDepositModal() { document.getElementById('depositModal').style.display = 'none'; }

        function openWithdrawModal() { document.getElementById('withdrawModal').style.display = 'flex'; }
        function closeWithdrawModal() { document.getElementById('withdrawModal').style.display = 'none'; }
        
        function closePok9Modal() { document.getElementById('pok9Modal').style.display = 'none'; }

        function submitDepositAuto() {
            let amountStr = document.getElementById('depositAmount').value.replace(/,/g, '');
            let amount = parseInt(amountStr);
            let fileInput = document.getElementById('slipFile');

            if (!amount || amount <= 0) {
                alert("ກະລຸນາໃສ່ຈຳນວນເງິນທີ່ໂອນ!");
                return;
            }
            if (fileInput.files.length === 0) {
                alert("ກະລຸນາແນບຮູບສະລິບການໂອນເງິນ!");
                return;
            }

            document.getElementById('statusMsg').innerText = "⏳ AI ກຳລັງອ່ານເລກໃບບິນຈາກສະລິບ...";
            document.getElementById('whatsappDepositBtn').style.display = 'none';

            let reader = new FileReader();
            let file = fileInput.files[0];

            reader.onload = function (e) {
                let slipBase64 = e.target.result;
                
                localStorage.setItem('pending_slip_image', slipBase64);
                localStorage.setItem('pending_username', myUsername);
                localStorage.setItem('pending_amount', amount);

                socket.emit('request_deposit_auto', { 
                    username: myUsername, 
                    amount: amount,
                    slip: slipBase64 
                });
            };
            reader.readAsDataURL(file);
        }

        socket.on('deposit_ai_failed', (data) => {
            document.getElementById('statusMsg').innerText = data.msg;
            document.getElementById('statusMsg').style.color = '#ef4444';

            let waMsg = encodeURIComponent(`ສະບາຍດີແອັດມິນ, ຂ້ອຍຊື່ User: ${data.username}, ຢາກແຈ້ງເຕີມເງິນຈຳນວນ ${data.amount.toLocaleString()} ກີບ ແຕ່ລະບົບ AI ອ່ານສະລິບບໍ່ຜ່ານ, ນີ້ແມ່ນສະລິບຢືນຍັນ.`);
            let adminPhone = "8562091445369";
            
            let waButton = document.getElementById('whatsappDepositBtn');
            waButton.href = `https://wa.me/${adminPhone}?text=${waMsg}`;
            waButton.style.display = 'block';
        });

        socket.on('deposit_auto_success', (msg) => {
            alert(msg);
            closeDepositModal();
            document.getElementById('depositAmount').value = '';
            document.getElementById('slipFile').value = '';
            document.getElementById('statusMsg').innerText = '';
        });

        function submitWithdraw() {
            let amountStr = document.getElementById('withdrawAmount').value.replace(/,/g, '');
            let amount = parseInt(amountStr);

            if (!amount || amount <= 500) {
                alert("ກະລຸນາໃສ່ຈຳນວນເງິນຖອນໃຫ້ຖືກຕ້ອງ!");
                return;
            }

            let btn = document.getElementById('withdrawBtn');
            btn.disabled = true;
            btn.innerText = "⏳ กำลังส่งข้อมูล...";

            let adminPhone = "8562091445369";
            let message = encodeURIComponent(`💰 ແຈ້ງຖອນເງິນຈາກລູກຄ້າ:\n` +
                          `👤 User: ${myUsername}\n` +
                          `💵 ຈຳນວນເງິນຖອນ: ${amount.toLocaleString()} ກີບ`);
            window.open(`https://wa.me/${adminPhone}?text=${message}`, '_blank');

            socket.emit('request_withdraw', { username: myUsername, amount: amount });
        }

        socket.on('withdraw_success', (data) => {
            alert(data.msg);
            closeWithdrawModal();
            document.getElementById('withdrawAmount').value = '';
            
            let btn = document.getElementById('withdrawBtn');
            btn.disabled = false;
            btn.innerText = "📤 ຢືນຍັນແຈ້ງຖອນຜ່ານ WhatsApp";
        });

        socket.on('error_msg', (msg) => { 
            alert(msg); 
            let btn = document.getElementById('withdrawBtn');
            if (btn) {
                btn.disabled = false;
                btn.innerText = "📤 ຢືນຍັນແຈ້ງຖອນຜ່ານ WhatsApp";
            }
        });

        function playWithDealer() {
            let amountStr = document.getElementById('betInput').value.replace(/,/g, '');
            let amount = parseInt(amountStr);
            if (isNaN(amount) || amount <= 0) {
                alert("ກະລຸນາໃສ່ຍອດເດີມພັນໃຫ້ຖືກຕ້ອງ!");
                return;
            }
            socket.emit('play_with_dealer', { amount: amount });
        }

        function createCustomRoom() {
            let rules = {
                aaBonus: document.getElementById('ruleAA').checked,
                dengBonus: document.getElementById('ruleDeng').checked
            };
            socket.emit('create_custom_room', { rules: rules });
        }

        function createRoom() { socket.emit('create_room'); }
        function joinRoom() {
            let roomId = document.getElementById('joinRoomInput').value.trim();
            if (roomId) socket.emit('join_custom_room', { roomId: roomId });
        }

        socket.on('room_created', (data) => {
            currentRoomId = data.roomId;
            updateRoomUI(data.roomId, data.players);
            alert("ສ້າງຫ້ອງສຳເລັດ!");
        });

        socket.on('update_room_players', (data) => {
            currentRoomId = data.roomId;
            updateRoomUI(data.roomId, data.players);
        });

        function updateRoomUI(roomId, players) {
            document.getElementById('roomInfo').style.display = 'block';
            document.getElementById('roomIdText').innerText = roomId;
            let listDiv = document.getElementById('playerList');
            listDiv.innerHTML = '';
            players.forEach(p => {
                let div = document.createElement('div');
                div.className = 'player-card-tag';
                div.innerHTML = `👤 <b>${p.name}</b> — ເຄດິດ: <span style="color: #facc15;">${p.credit.toLocaleString()} ກີບ</span>`;
                listDiv.appendChild(div);
            });
        }

        function copyRoomLink() {
            let link = window.location.origin + window.location.pathname + '?room=' + currentRoomId;
            navigator.clipboard.writeText(link);
            alert("ກັອບປີ້ລິ້ງສຳເລັດ!");
        }

        function dealCardsWithSuspense(playerArr, dealerArr, isPok9, callback) {
            let pContainer = document.getElementById('playerCards');
            let dContainer = document.getElementById('dealerCards');
            
            pContainer.innerHTML = '';
            dContainer.innerHTML = '';

            if (!playerArr || playerArr.length < 2 || !dealerArr || dealerArr.length < 2) {
                if (callback) callback();
                return;
            }

            let cardD1 = createCardElement(dealerArr[0]);
            let cardD2 = createCardElement(dealerArr[1]);
            dContainer.appendChild(cardD1);
            dContainer.appendChild(cardD2);

            let cardP1 = createCardElement(playerArr[0]);
            let cardP2 = createCardElement(playerArr[1]);
            
            if (isPok9) {
                cardP1.classList.add('pok9-glow');
                cardP2.classList.add('pok9-glow');
            }

            pContainer.appendChild(cardP1);
            pContainer.appendChild(cardP2);

            if (callback) callback();
        }

        function createCardElement(c) {
            let span = document.createElement('span');
            span.className = 'card' + (['♥', '♦'].includes(c.suit) ? ' red' : '');
            span.innerText = c.value + c.suit;
            return span;
        }

        socket.on('game_result', (data) => {
            document.getElementById('resultBox').style.display = 'block';
            
            let isWin = data.result.includes('ຊະນະ');
            let isPok9User = data.result.includes('ປ໋ອກຊ໋ອດ 9');

            dealCardsWithSuspense(data.playerCards, data.dealerCards, isPok9User, () => {
                document.getElementById('playerScore').innerText = data.playerScore;
                document.getElementById('dealerScore').innerText = data.dealerScore;
                document.getElementById('playerScoreText').style.display = 'inline';
                document.getElementById('dealerScoreText').style.display = 'inline';
                document.getElementById('gameResultText').innerText = data.result;
                
                let payoutElem = document.getElementById('payoutText');
                let payoutArea = document.getElementById('payoutArea');
                payoutArea.style.display = 'block';

                if (data.payout < 0) {
                    payoutElem.style.color = '#ef4444';
                    payoutElem.innerText = data.payout.toLocaleString() + ' ກີບ';
                } else if (data.payout === 0) {
                    payoutElem.style.color = '#facc15';
                    payoutElem.innerText = '0 ກີບ (ໄດ້ທຶນຄືນ)';
                } else {
                    payoutElem.style.color = '#22c55e';
                    payoutElem.innerText = '+' + data.payout.toLocaleString() + ' ກີບ';
                }

                if (isWin) {
                    let titleText = isPok9User ? "✨ ຍິນດີນຳທ່ານໄດ້ ປ໋ອກ 9! ✨" : "🎉 ຍິນດີດ້ວຍ! ທ່ານຊະນະແລ້ວ!";
                    document.getElementById('pok9TitleText').innerText = titleText;
                    document.getElementById('pok9WinText').innerText = `ໄດ້ຮັບເງິນລາງວັນ +${data.payout.toLocaleString()} ກີບ!`;
                    document.getElementById('pok9Modal').style.display = 'flex';
                }
            });
        });

        function sendMessage() {
            let input = document.getElementById('chatInput');
            if (input.value.trim() !== '') {
                socket.emit('send_message', { roomId: currentRoomId, text: input.value });
                input.value = '';
            }
        }

        socket.on('receive_message', (data) => {
            let chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML += `<div><b>${data.username}:</b> ${data.text}</div>`;
            chatMessages.scrollTop = chatMessages.scrollHeight;
        });
    </script>
